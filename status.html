<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สถานะการแจ้งซ่อม - Green Food Factory</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e2e8f0 100%);
            margin: 0;
            padding: 0;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.1);
            border: 2px solid #bbf7d0;
            margin: 30px 0;
        }

        .header-badge {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 {
            color: #166534;
            font-size: 26px;
            margin: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ticket-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .ticket-id {
            font-size: 20px;
            font-weight: bold;
            color: #15803d;
        }

        .status-badge {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fca5a5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .info-row {
            display: flex;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .info-label {
            width: 140px;
            font-weight: 600;
            color: #64748b;
        }

        .info-value {
            flex: 1;
            color: #0f172a;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: #22c55e;
            color: white;
        }

        .btn-primary:hover {
            background: #16a34a;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="header-badge">🥬 GREEN FOOD FACTORY</span>
        <h1>📌 ติดตามสถานะการแจ้งซ่อม</h1>
        <p style="color: #64748b; font-size: 14px; margin-top: -5px;">ข้อมูลการแจ้งซ่อมล่าสุดของคุณในระบบ</p>

        <div class="ticket-card" id="ticketContainer">
            <!-- ข้อมูลจะถูกดึงมาใส่ตรงนี้ด้วย JS -->
        </div>

        <div class="btn-group">
            <a href="repair.html" class="btn btn-secondary">🔧 แจ้งซ่อมเพิ่ม</a>
            <a href="index.html" class="btn btn-primary">🏠 กลับหน้าหลัก</a>
        </div>
    </div>

    <script>
        // ดึงข้อมูลจาก LocalStorage
        const ticketData = JSON.parse(localStorage.getItem('latestTicket'));
        const container = document.getElementById('ticketContainer');

        if (ticketData) {
            container.innerHTML = `
                <div class="ticket-header">
                    <div>
                        <div style="font-size: 12px; color: #64748b;">เลขที่ใบแจ้งซ่อม</div>
                        <div class="ticket-id">${ticketData.ticketId}</div>
                    </div>
                    <div class="status-badge">${ticketData.status}</div>
                </div>

                <div class="info-row">
                    <div class="info-label">⏱️ วัน-เวลา :</div>
                    <div class="info-value">${ticketData.time}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">👤 ผู้แจ้งซ่อม :</div>
                    <div class="info-value">${ticketData.reporter}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">📍 โซน / ห้อง :</div>
                    <div class="info-value">${ticketData.zone} (${ticketData.room})</div>
                </div>
                <div class="info-row">
                    <div class="info-label">⚙️ เครื่องจักร :</div>
                    <div class="info-value">${ticketData.machine}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">📝 อาการเสีย :</div>
                    <div class="info-value">${ticketData.details}</div>
                </div>
            `;
        } else {
            container.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">ไม่พบข้อมูลการแจ้งซ่อมล่าสุด</div>`;
        }
    </script>

</body>
</html>
